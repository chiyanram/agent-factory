name: release

# Runs only from "Run workflow" on main (gh workflow run release.yml --ref main): during the dev phase a merge does not
# release (#327). It runs the same checks as ci.yml first, then releases (#351).
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cut off halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the release commit and the v<version> tag
      issues: write         # comment "released in" on the issues a release closes
      pull-requests: write  # comment "released in" on the merged pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The first run has no v* tag. Tag this commit v0.0.0, so semantic-release counts from here and the next feat
      # releases 0.1.0, instead of reading the whole history and starting at 1.0.0 (#153). Every later run finds a
      # tag and skips this.
      - name: Baseline tag
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git -c user.name=github-actions -c user.email=github-actions@github.com tag -a v0.0.0 HEAD -m "agent-factory 0.0.0: the baseline before the first release"
            git push origin v0.0.0
          fi

      - run: npm ci --no-fund --no-audit

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
