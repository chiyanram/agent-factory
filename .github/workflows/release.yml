name: release

# Runs only from "Run workflow" on main (gh workflow run release.yml --ref main): during the dev phase a merge does not
# release (#327). It runs the same checks as ci.yml first, then releases (#351).
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cut off halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the release commit and the v<version> tag
      issues: write         # open an issue when a release fails (semantic-release failComment)
    steps:
      # Ruleset main takes changes only through a pull request; its bypass is the admin role, so the release commit
      # is pushed with the owner's token. The GitHub Actions app cannot bypass a ruleset on a user-owned repo (#350).
      - name: The release token is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret RELEASE_TOKEN is not set: the release commit cannot pass ruleset main. See CONTRIBUTING.md#releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The first run has no v* tag. Tag this commit v0.0.0, so semantic-release counts from here and the next feat
      # releases 0.1.0, instead of reading the whole history and starting at 1.0.0 (#153). Every later run finds a
      # tag and skips this.
      - name: Baseline tag
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git -c user.name=github-actions -c user.email=github-actions@github.com tag -a v0.0.0 HEAD -m "agent-factory 0.0.0: the baseline before the first release"
            git push origin v0.0.0
          fi

      - run: npm ci --no-fund --no-audit

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
