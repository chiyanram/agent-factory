name: ci

# A push or a ready-for-review runs this; an edited title or description runs only pr-title.yml and pr-body.yml, and a
# label change only eval-approval.yml, so neither waits for a macOS runner. ready_for_review runs macOS on a pull request
# that was a draft (scripts/macos-needed.ts). CONTRIBUTING.md#what-ci-runs-where has the whole table.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A repository owned by a user cannot have a merge queue, so this never fires today; it is kept so the queue works
  # if the repository moves to an organisation.
  merge_group:
  push:
    branches: [main]
  # release.yml runs these checks first, then releases (#351).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Runs on main are never cancelled. The event name
# keeps the checks that release.yml calls out of the group of a push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node 26 is the one version we support, test, build, release and ship on (package.json engines; operator,
  # 2026-11-10, #30). The job keeps its name, lint-and-test, so the required check on ruleset main matches it.
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read          # check-today reads which tickets are open; no model runs in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-evals applies each golden-set case to its base commit, and check-eval-proof diffs against the
          # default branch, so make lint needs the history
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # check-today fails a Today: note whose tickets are all closed. make lint has no network, so this step lists the
      # open tickets with the workflow's own read-only token, and make lint reads the file it names.
      - name: List the open tickets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 5000 --json number > "$RUNNER_TEMP/open-tickets.json"
          echo "FACTORY_OPEN_TICKETS=$RUNNER_TEMP/open-tickets.json" >> "$GITHUB_ENV"
      - run: make lint
      # the rules pack at the commit .github/rules-pack.json pins: test/rules-pack.test.ts checks that it holds each skill
      # the engine names (P18), and fails in CI when this checkout is missing
      - name: Fetch the pinned rules pack
        run: |
          repo=$(node -p "require('./.github/rules-pack.json').repo")
          commit=$(node -p "require('./.github/rules-pack.json').commit")
          tag=$(node -p "require('./.github/rules-pack.json').tag")
          # the tag the sessions load (.claude/settings.json) still points at the pinned commit (#580)
          test "$(git ls-remote "$repo" "refs/tags/$tag" "refs/tags/$tag^{}" | tail -1 | cut -f1)" = "$commit" || \
            { echo "rules-pack tag $tag does not point at $commit"; exit 1; }
          git init -q "$RUNNER_TEMP/rules-pack"
          git -C "$RUNNER_TEMP/rules-pack" fetch -q --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/rules-pack" checkout -q FETCH_HEAD
          echo "FACTORY_RULES_PACK=$RUNNER_TEMP/rules-pack" >> "$GITHUB_ENV"
      # git's default branch on the runner is master; the suite runs once with main, as on the pilot's machines (#485)
      - name: git's default branch is main
        run: git config --global init.defaultBranch main
      - run: make test
      - run: make build

  # The clean-machine install test (#485): the packed package installed with npm into an empty prefix, then
  # --version, init --yes and dispatch --dry-run on a fresh home. This job runs it on Ubuntu; test-macos runs it on
  # macOS, so each run asks for one macOS runner, not two. release.yml runs this workflow first, so a failure here
  # blocks a release.
  install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/install-test.ts

  # Whether test-macos runs: always but on a pull request that is a draft or touches docs only (scripts/macos-needed.ts).
  macos-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: gate
        run: node scripts/macos-needed.ts

  # The suite and the install test on macOS, with git's own default branch: the pilot hit engine bugs only a real Mac
  # showed (the socket path limit, /var behind a symlink) (#485, was #462). It stays a required check: when the gate
  # skips it, GitHub counts the skipped job as passing. It runs unless the gate said false, so a gate that failed or
  # wrote nothing runs macOS rather than letting a skip pass.
  test-macos:
    needs: macos-gate
    if: ${{ !cancelled() && needs.macos-gate.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # the same pinned rules pack as the Linux job: test/rules-pack.test.ts fails in CI without it
      - name: Fetch the pinned rules pack
        run: |
          repo=$(node -p "require('./.github/rules-pack.json').repo")
          commit=$(node -p "require('./.github/rules-pack.json').commit")
          tag=$(node -p "require('./.github/rules-pack.json').tag")
          # the tag the sessions load (.claude/settings.json) still points at the pinned commit (#580)
          test "$(git ls-remote "$repo" "refs/tags/$tag" "refs/tags/$tag^{}" | tail -1 | cut -f1)" = "$commit" || \
            { echo "rules-pack tag $tag does not point at $commit"; exit 1; }
          git init -q "$RUNNER_TEMP/rules-pack"
          git -C "$RUNNER_TEMP/rules-pack" fetch -q --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/rules-pack" checkout -q FETCH_HEAD
          echo "FACTORY_RULES_PACK=$RUNNER_TEMP/rules-pack" >> "$GITHUB_ENV"
      - run: make test
      - run: node scripts/install-test.ts
