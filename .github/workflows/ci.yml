name: ci

on:
  pull_request:
    # labeled and unlabeled: check-eval-proof reads the operator's eval-baseline-approved label from the event (#217)
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # the merge queue builds each pull request on top of the ones ahead of it, and merges it only when this run passes (#323)
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Runs on main are never cancelled, so a release
# is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-evals applies each golden-set case to its base commit, and check-eval-proof diffs against the
          # default branch, so make lint needs the history
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make lint
      - run: make test
      - run: make build

  # The factory runs on stock macOS laptops, where tmpdir() sits behind a symlink and bash is 3.2; a test that passes on
  # Linux can fail there (#196, #222). make test only: lint and build give the same answer on both.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the check-evals test runs the check on the real golden set, which needs each case's base commit
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The runner image may put a newer bash first on PATH; the stock /bin/bash is the 3.2 a Mac ships.
      - name: make test with the stock bash
        run: |
          mkdir -p "$RUNNER_TEMP/stock-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/stock-bash/bash"
          export PATH="$RUNNER_TEMP/stock-bash:$PATH"
          bash --version | head -1
          make test

  # Pull requests are squash-merged with the PR title as the commit subject, so the title is what semantic-release
  # reads on main (#153).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit, e.g. 'feat(box): one box seam (#112)'. See CONTRIBUTING.md#releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A skip-ci marker in the title, the description or a commit message would reach main in the squash and skip the
      # push run, and with it the release.
      - name: No skip-ci marker that would reach main
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks: *true'
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE "$marker" || git log --format=%B "origin/$BASE_REF..$HEAD_SHA" | grep -qiE "$marker"; then
            echo "::error::The title, description or a commit message contains a skip-ci marker. The squash merge would carry it to main and skip the checks there. Reword it."
            exit 1
          fi

  # Runs only from "Run workflow" on main: during the dev phase a merge does not release (#327). A push to main runs
  # the checks alone.
  release:
    needs: [lint-and-test, test-macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the release commit and the v<version> tag
      issues: write         # comment "released in" on the issues a release closes
      pull-requests: write  # comment "released in" on the merged pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The first run has no v* tag. Tag this commit v0.0.0, so semantic-release counts from here and the next feat
      # releases 0.1.0, instead of reading the whole history and starting at 1.0.0 (#153). Every later run finds a
      # tag and skips this.
      - name: Baseline tag
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git -c user.name=github-actions -c user.email=github-actions@github.com tag -a v0.0.0 HEAD -m "agent-factory 0.0.0: the baseline before the first release"
            git push origin v0.0.0
          fi

      - run: npm ci --no-fund --no-audit

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
