name: ci

on:
  pull_request:
    # labeled and unlabeled: check-eval-proof reads the operator's eval-baseline-approved label from the event (#217)
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # the merge queue builds each pull request on top of the ones ahead of it, and merges it only when this run passes (#323)
  merge_group:
  push:
    branches: [main]
  # release.yml runs these checks first, then releases (#351).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Runs on main are never cancelled. The event name
# keeps the checks that release.yml calls out of the group of a push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node 26 is the one version we support, test, build, release and ship on (package.json engines; operator,
  # 2026-11-10, #30). The job keeps its name, lint-and-test, so the required check on ruleset main matches it.
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-evals applies each golden-set case to its base commit, and check-eval-proof diffs against the
          # default branch, so make lint needs the history
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: make lint
      # the rules pack at the commit .github/rules-pack.json pins: test/pack-schema.test.ts reads every process and role
      # card of it through the engine, and fails in CI when this checkout is missing (#484)
      - name: Fetch the pinned rules pack
        run: |
          repo=$(node -p "require('./.github/rules-pack.json').repo")
          commit=$(node -p "require('./.github/rules-pack.json').commit")
          git init -q "$RUNNER_TEMP/rules-pack"
          git -C "$RUNNER_TEMP/rules-pack" fetch -q --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/rules-pack" checkout -q FETCH_HEAD
          echo "FACTORY_RULES_PACK=$RUNNER_TEMP/rules-pack" >> "$GITHUB_ENV"
      - run: make test
      - run: make build

  # The clean-machine install test (#485): the packed package installed with npm into an empty prefix, then
  # --version, init --yes and dispatch --dry-run on a fresh home, on Ubuntu and on macOS. release.yml runs this
  # workflow first, so a failure here blocks a release.
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/install-test.ts

  # Pull requests are squash-merged with the PR title as the commit subject, so the title is what semantic-release
  # reads on main (#153).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # One rule in chiyanram/skills, agent-factory and rca-agent (#327): a scope, a lower-case summary and the issue
        # it works on, as (#N) or (owner/repo#N). Dependabot (scope deps) and the release commit name no issue.
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)\([a-z0-9-]+\)!?: [^A-Z].*\([^)]*#[0-9]+[^)]*\)'
          exempt='^[a-z]+\(deps\): |^chore\(release\): '
          if [[ ! "$TITLE" =~ $pattern && ! "$TITLE" =~ $exempt ]]; then
            echo "::error::PR title \"$TITLE\" must be 'type(scope): lower-case summary (#issue)', e.g. 'feat(box): one box seam (#112)'. See CONTRIBUTING.md#releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A skip-ci marker in the title, the description or a commit message would reach main in the squash and skip the
      # push run, and with it the release.
      - name: No skip-ci marker that would reach main
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks: *true'
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE "$marker" || git log --format=%B "origin/$BASE_REF..$HEAD_SHA" | grep -qiE "$marker"; then
            echo "::error::The title, description or a commit message contains a skip-ci marker. The squash merge would carry it to main and skip the checks there. Reword it."
            exit 1
          fi
