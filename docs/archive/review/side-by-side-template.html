<title>Side by Side</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky area nav, then one section per area: a facts table (OURS column tinted) and the references' stated reasons. Describes only. */
:root{--bg:#f4f6f5;--surface:#fff;--fg:#1b2422;--muted:#56635f;--line:#d5ddd9;--accent:#0f6b5c;--ours:#fbefdc;--ours-line:#a15c00;
 --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111514;--surface:#1a201e;--fg:#e3eae7;--muted:#9aa6a1;--line:#2c3532;--accent:#5cc4ae;--ours:#33281a;--ours-line:#e6a54a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111514;--surface:#1a201e;--fg:#e3eae7;--muted:#9aa6a1;--line:#2c3532;--accent:#5cc4ae;--ours:#33281a;--ours-line:#e6a54a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1{font-size:1.7rem;margin:0 0 4px} .lead{color:var(--muted);max-width:80ch;margin:0 0 10px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
nav a{font-size:.8rem;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px}
h2{font-size:1.2rem;margin:36px 0 8px;scroll-margin-top:70px} h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
code{font-family:var(--mono);font-size:.82em;overflow-wrap:anywhere}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;font-size:.8rem;min-width:1400px}
th,td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:120px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.facet,th:first-child{position:sticky;left:0;background:var(--surface);font-weight:700;min-width:110px;z-index:1}
.ours{background:var(--ours);min-width:240px} th.ours{color:var(--ours-line)}
ul,ol{margin:4px 0;padding-left:20px;font-size:.9rem;max-width:110ch} li{margin:2px 0}
.note{color:var(--muted);font-size:.85rem;max-width:110ch}
</style>
<div class="wrap">
<h1>Side by Side</h1>
<p class="lead">Our setup as it runs on 2026-10-18 (tinted column) next to each reference project and agent product, with the reasons they give. Facts only: no verdicts, every cell cited, unknown where no source says. Source: research/14 · ticket #12 · chiyanram/agent-factory.</p>
{{NAV}}
{{BODY}}
</div>
